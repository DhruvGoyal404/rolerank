# Local development. Project "rolerank"; credentials come from the gitignored .env.
name: rolerank

x-labels: &labels
  rolerank.managed: "true"

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    labels: *labels
    environment:
      POSTGRES_PASSWORD: ${ROLERANK_PG_SUPERUSER_PASSWORD:?set in .env}
      ROLERANK_PW_MIGRATOR_APP: ${ROLERANK_PW_MIGRATOR_APP:?set in .env}
      ROLERANK_PW_MIGRATOR_CORPUS: ${ROLERANK_PW_MIGRATOR_CORPUS:?set in .env}
      ROLERANK_PW_APP_RW: ${ROLERANK_PW_APP_RW:?set in .env}
      ROLERANK_PW_CORPUS_RW: ${ROLERANK_PW_CORPUS_RW:?set in .env}
      ROLERANK_PW_CORPUS_RO: ${ROLERANK_PW_CORPUS_RO:?set in .env}
    # Memory sized like the Phase 0 spike, so the bench's indexes stay in memory. The host's
    # values are set in P8 from its own size.
    command: >-
      postgres -c shared_buffers=1536MB -c effective_cache_size=3GB -c maintenance_work_mem=512MB
      -c work_mem=16MB -c max_parallel_maintenance_workers=4
    shm_size: 1gb # parallel index builds use shared memory; Docker's default is 64 MB
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pg:/var/lib/postgresql
      - ./db/provision:/opt/rolerank/provision:ro
      - ./db/provision/init.sh:/docker-entrypoint-initdb.d/10-rolerank.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    labels: *labels
    command: ["valkey-server", "--requirepass", "${ROLERANK_VALKEY_PASSWORD:?set in .env}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    environment:
      ROLERANK_VALKEY_PASSWORD: ${ROLERANK_VALKEY_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:56380:6379"
    volumes:
      - valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$ROLERANK_VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate-app:
    image: amacneil/dbmate:2.36.0@sha256:520c740c6e0ad73fde2cd1ea7e2b779aaf789d22aca8858f87a478e7094535fb
    labels: *labels
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://migrator_app:${ROLERANK_PW_MIGRATOR_APP:?set in .env}@postgres:5432/app?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/app/migrations:/db/migrations:ro

  migrate-corpus:
    image: amacneil/dbmate:2.36.0@sha256:520c740c6e0ad73fde2cd1ea7e2b779aaf789d22aca8858f87a478e7094535fb
    labels: *labels
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://migrator_corpus:${ROLERANK_PW_MIGRATOR_CORPUS:?set in .env}@postgres:5432/corpus?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/corpus/migrations:/db/migrations:ro

  # Embeddings need cgo and ONNX Runtime, so they run here, in Linux, as on the host.
  # scripts/models.sh fills ./models first; scripts/embed.sh runs this.
  embed:
    image: golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
    labels: *labels
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /src/worker
    environment:
      CGO_ENABLED: "1"
      GOFLAGS: -buildvcs=false
      GOTOOLCHAIN: auto # go.mod pins go1.27.3; the image is 1.27.2, the newest old enough
      ROLERANK_CORPUS_URL: postgres://corpus_rw:${ROLERANK_PW_CORPUS_RW:?set in .env}@postgres:5432/corpus?sslmode=disable
      ROLERANK_ORT_LIB: /models/onnxruntime/onnxruntime-linux-x64-1.31.0/lib/libonnxruntime.so.1.31.0
      ROLERANK_EMBED_MODEL: /models/bge-small-en-v1.5/model.onnx
    volumes:
      - ./worker:/src/worker:ro
      - ./models:/models:ro
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod

volumes:
  pg:
    labels: *labels
  valkey:
    labels: *labels
  gocache:
    labels: *labels
  gomod:
    labels: *labels
