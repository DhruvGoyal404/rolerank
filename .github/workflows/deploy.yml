# Production build and deploy, run by rolerank-up.sh (or by hand) while the site is up: builds the
# four images for arm64 from this commit, pushes them to ECR tagged with the commit, and runs the
# RoleRank-Deploy SSM document on the host with a manifest pinning every image by digest. The
# host pulls by digest, migrates, smoke tests, and rolls back by itself on failure
# (deploy/host/deploy.sh). Never on a schedule or a push: the site is normally down.
#
# AWS access is GitHub OIDC only, no stored AWS keys. The role trusts exactly
# repo:DhruvGoyal404@151380878/rolerank@1440707842:ref:refs/heads/main (infra/ GITHUB_SUB).
# Don't add a GitHub "environment" to this job: it changes the token's sub claim.
#
# Repository secrets, from the RoleRankProd outputs (masked in every log line):
#   AWS_DEPLOY_ROLE_ARN   DeployRoleArn
#   ECR_REGISTRY          Registry
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for AWS

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a deploy half way

defaults:
  run:
    shell: bash

env:
  AWS_REGION: ap-south-1
  DOCUMENT: RoleRank-Deploy

jobs:
  deploy:
    name: Deploy to production
    if: github.repository == 'DhruvGoyal404/rolerank' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      SHA: ${{ github.sha }}
      REGISTRY: ${{ secrets.ECR_REGISTRY }}
    steps:
      - name: Mask the AWS account ID
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          account=$(cut -d: -f5 <<<"$ROLE_ARN")
          [[ "$account" =~ ^[0-9]{12}$ ]] || { echo "::error::secret AWS_DEPLOY_ROLE_ARN is not an IAM role ARN"; exit 1; }
          echo "::add-mask::$account"
          [ -n "$REGISTRY" ] || { echo "::error::set the ECR_REGISTRY secret"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: rolerank-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Find the host
        run: |
          set -euo pipefail
          id=$(aws ec2 describe-instances --filters Name=tag:rolerank:host,Values=prod Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$id" ] || [ "$id" = None ]; then echo "::error::site is down, run rolerank-up.sh first"; exit 1; fi
          [ "$(wc -w <<<"$id")" = 1 ] || { echo "::error::more than one running host is tagged rolerank:host=prod"; exit 1; }
          echo "::add-mask::$id"
          echo "INSTANCE_ID=$id" >>"$GITHUB_ENV"
      - name: Log in to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Build and push images (tag = commit, recorded by digest)
        run: |
          set -euo pipefail
          # Tags are immutable in ECR: a re-run for the same commit reuses the first push's digest.
          publish() { # publish NAME DOCKERFILE CONTEXT
            local repo="rolerank/$1" digest
            digest=$(aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$SHA" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
            if [[ "$digest" != sha256:* ]]; then
              docker build -q --label rolerank.managed=true -t "$REGISTRY/$repo:$SHA" -f "$2" "$3" >/dev/null
              docker push -q "$REGISTRY/$repo:$SHA" >/dev/null
              digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REGISTRY/$repo:$SHA" | grep -m1 "^$REGISTRY/$repo@" | cut -d@ -f2)
            fi
            echo "$1 $REGISTRY/$repo@$digest" | tee -a "$RUNNER_TEMP/images.txt"
          }
          publish api deploy/api.Dockerfile .
          publish web deploy/web.Dockerfile .
          publish worker deploy/worker.Dockerfile .
          publish sandbox extractor/Dockerfile extractor
      - name: Release manifest
        run: |
          set -euo pipefail
          jq -Rn --arg r "$SHA" '[inputs | split(" ") | {key: .[0], value: .[1]}] | from_entries as $i | {release: $r, images: $i}' \
            <"$RUNNER_TEMP/images.txt" >release.json
          jq -e '[.images.api, .images.web, .images.worker, .images.sandbox] | all(test("@sha256:[0-9a-f]{64}$"))' release.json >/dev/null
          { echo '### Release'; echo '```json'; sed "s#$REGISTRY#<registry>#g" release.json; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - name: Run RoleRank-Deploy on the host
        run: |
          set -euo pipefail
          manifest=$(base64 -w0 release.json)
          [ "${#manifest}" -le 4000 ] || { echo "::error::manifest is ${#manifest} characters, the document allows 4000"; exit 1; }
          params=$(jq -cn --arg m "$manifest" '{Manifest: [$m]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "$DOCUMENT" --document-version '$LATEST' \
            --parameters "$params" --timeout-seconds 600 --comment "deploy ${SHA:0:12}" --query Command.CommandId --output text)
          status=Pending
          for _ in $(seq 180); do # up to 30 min, the document's own timeout
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "status: $status"
          [ "$status" = Success ] || { echo "::error::deploy $status (the host rolls back by itself; see the output above)"; exit 1; }
